<text x="84" y="677" fill="#afc0d5" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Stream text / tool calls</text>
<text x="84" y="713" fill="#afc0d5" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Host runs authorized tools</text>
